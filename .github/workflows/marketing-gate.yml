name: ReelDive Marketing Protocol Gate

on:
  push:
    branches: [ main, marketing-automation ]
    paths:
      - 'content/staging/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'content/staging/**'

jobs:
  validate-marketing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # Install openai, anthropic, or whatever SDK your Sentinel agent uses
          pip install openai minimal-markdown

      - name: Run Sentinel Guardrail Audit
        env:
          OPENAI_API_KEY: ${{ secrets.SENTINEL_OPENAI_API_KEY }}
        run: |
          # Run a custom python verification script that feeds marketing.md 
          # and the new content staging files to your validation LLM
          python .github/scripts/sentinel_check.py
